version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    #image: cart-api-docker:latest # Replace with your actual image name
    container_name: cart-api-container
    ports:
      - "8091:8091" # Map the container's port 8091 to the host's port 8091
    environment:
      - SPRING_PROFILES_ACTIVE=h2 # Activate the 'h2' profile if configured
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:testdb
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=sa