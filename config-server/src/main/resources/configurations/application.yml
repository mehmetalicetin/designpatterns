spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

logging:
  level:
    root: INFO

management:
  health:
    circuitbreaker:
      enabled: true  # Fixed: Changed 'enable' to 'enabled'
  endpoints:
    web:
      exposure:
        include: "*"  # Fixed: Added quotes around '*'
  endpoint:
    health:
      show-details: always  # Fixed: Removed extra period

