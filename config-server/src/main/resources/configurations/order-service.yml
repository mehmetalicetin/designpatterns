server:
  port: 8092

customer:
  service:
    url: http://localhost:8089

cart:
  service:
    url: http://localhost:8091


eureka:
  client:
    enabled: true
  instance:
    hostname: localhost
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
    preferIpAddress: true